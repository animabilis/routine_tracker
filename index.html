<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>30분 청크 루틴 트래커</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-2: #273549;
    --border: #334155;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --primary: #3b82f6;
    --primary-soft: rgba(59, 130, 246, 0.22);
    --accent: #f59e0b;
    --accent-soft: rgba(245, 158, 11, 0.18);
    --success: #10b981;
    --postit: #fef08a;
    --postit-text: #1e293b;
    --slot-h: 44px; /* 30분당 기준 높이 */
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  /* 비전보드 스플래시 */
  #vision-splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #090d16;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: opacity 0.3s ease;
  }
  #vision-splash.hidden { opacity: 0; pointer-events: none; }
  #vision-splash img {
    max-width: 100%;
    max-height: 60vh;
    border-radius: 16px;
    object-fit: contain;
    margin-bottom: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  }
  #vision-splash .vision-quote {
    font-size: 1.3rem;
    font-weight: 700;
    line-height: 1.5;
    color: #f8fafc;
    white-space: pre-line;
    max-width: 520px;
  }
  #vision-splash .skip-hint {
    position: absolute;
    bottom: 24px;
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  /* 상단 고정 헤더 (모바일 가로 최적화) */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 10px;
    flex-shrink: 0;
    z-index: 20;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .date-nav {
    display: flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
  }
  .date-nav button {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 7px;
    padding: 5px 7px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .date-title {
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    padding: 4px 7px;
    border-radius: 7px;
    white-space: nowrap;
    letter-spacing: -0.02em;
    border: 1px solid transparent;
    transition: background 0.2s, border-color 0.2s;
  }
  /* 오늘 날짜 하이라이트 블록 */
  .date-title.is-today {
    background: var(--primary-soft);
    border-color: rgba(59, 130, 246, 0.65);
    color: #93c5fd;
  }

  /* 우측 액션 버튼 영역: 좁은 화면에서 좌우 스크롤 가능 */
  .header-actions {
    display: flex;
    align-items: center;
    gap: 5px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 1px 0;
  }
  .header-actions::-webkit-scrollbar { display: none; }

  .icon-btn {
    position: relative;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 7px;
    padding: 5px 8px;
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .icon-btn.active-mode {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
  }
  .icon-btn.postit-btn {
    background: var(--postit);
    color: var(--postit-text);
    border-color: #eab308;
  }
  .badge-count {
    background: #ef4444;
    color: white;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 99px;
  }

  /* 요약 및 수면 상태 바 */
  .summary-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 7px;
    font-size: 0.78rem;
    color: var(--text-muted);
    gap: 8px;
  }
  .progress-wrap {
    flex: 1;
    height: 6px;
    background: var(--bg);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--success);
    width: 0%;
    transition: width 0.25s ease;
  }
  .sleep-banner {
    margin-top: 6px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 0.76rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: #cbd5e1;
  }
  .sleep-time-link {
    color: #93c5fd;
    text-decoration: underline;
    cursor: pointer;
    font-weight: 600;
  }

  /* 메인 타임라인 스크롤 영역 */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px 96px;
    scroll-behavior: smooth;
  }

  .edit-mode-banner {
    background: var(--primary-soft);
    border: 1px solid var(--primary);
    border-radius: 10px;
    padding: 9px 12px;
    margin-bottom: 10px;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  /* 1:1 비례 청크 카드 */
  .chunk-wrapper {
    margin-bottom: 5px;
  }
  .chunk-card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 11px 7px 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    transition: opacity 0.2s, border-color 0.2s;
    overflow: hidden;
  }
  .slot-ticks {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 5px;
    display: flex;
    flex-direction: column;
  }
  .slot-tick-seg {
    flex: 1;
    background: #475569;
    border-bottom: 1px solid var(--bg);
  }
  .slot-tick-seg:last-child { border-bottom: none; }
  .chunk-card.is-tracked .slot-tick-seg { background: var(--primary); }
  .chunk-card.one-off .slot-tick-seg { background: var(--accent); }
  .chunk-card.completed .slot-tick-seg { background: var(--success); }

  .chunk-card.tall {
    align-items: flex-start;
    padding-top: 10px;
  }
  .chunk-card.tall .chunk-info {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
  }
  .chunk-card.tall .chunk-title {
    font-size: 1.02rem;
    margin: auto 0;
  }

  .chunk-card.past { opacity: 0.42; }
  .chunk-card.current {
    border-color: var(--primary);
    box-shadow: 0 0 0 1px var(--primary);
    background: var(--surface-2);
  }
  .chunk-card.one-off {
    border-color: rgba(245, 158, 11, 0.65);
    background: linear-gradient(90deg, var(--accent-soft) 0%, var(--surface) 40%);
  }
  .chunk-card.completed {
    border-color: rgba(16, 185, 129, 0.45);
  }
  .chunk-card.completed .chunk-title {
    text-decoration: line-through;
    color: var(--text-muted);
  }
  .chunk-card.untracked {
    background: rgba(30, 41, 59, 0.55);
  }

  .gap-card {
    border: 1px dashed #334155;
    border-radius: 10px;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #64748b;
    font-size: 0.76rem;
    background: rgba(15, 23, 42, 0.4);
  }

  .chunk-info {
    flex: 1;
    min-width: 0;
    cursor: pointer;
  }
  .chunk-time {
    font-size: 0.73rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }
  .tag-pill {
    font-size: 0.66rem;
    padding: 1px 5px;
    border-radius: 4px;
    font-weight: 700;
  }
  .tag-oneoff { background: var(--accent); color: #111827; }
  .tag-now { background: var(--primary); color: white; }
  .tag-duration { background: var(--bg); color: var(--text-muted); }
  .tag-memo-dot { background: rgba(147, 197, 253, 0.2); color: #93c5fd; }

  .chunk-title {
    font-size: 0.92rem;
    font-weight: 600;
    line-height: 1.3;
    word-break: keep-all;
    margin-top: 2px;
  }

  .chunk-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }
  .check-circle {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: 2px solid #64748b;
    background: transparent;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    cursor: pointer;
  }
  .check-circle.checked {
    background: var(--success);
    border-color: var(--success);
  }

  .track-toggle-btn {
    padding: 5px 8px;
    border-radius: 7px;
    font-size: 0.74rem;
    font-weight: 700;
    border: 1px solid var(--border);
    cursor: pointer;
    background: var(--bg);
    color: var(--text-muted);
  }
  .track-toggle-btn.on {
    background: var(--primary);
    border-color: var(--primary);
    color: white;
  }
  .mini-edit-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 7px;
    padding: 5px 7px;
    font-size: 0.75rem;
    cursor: pointer;
  }

  /* 카드 터치 시 열리는 한 줄 세부 메모 */
  .inline-memo-box {
    display: none;
    background: #162033;
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 10px 10px;
    padding: 7px 10px;
    margin-top: -4px;
  }
  .inline-memo-box.open { display: flex; gap: 6px; align-items: center; }
  .inline-memo-box input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    color: var(--text);
    font-size: 0.82rem;
  }

  /* 일기 섹션 */
  .diary-box {
    margin-top: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px;
  }
  .diary-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 0.88rem;
    font-weight: 700;
  }
  .diary-status { font-size: 0.74rem; color: var(--success); }
  textarea.diary-input {
    width: 100%;
    min-height: 88px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 9px;
    font-size: 0.88rem;
    line-height: 1.5;
    resize: vertical;
    font-family: inherit;
  }

  /* 하단 플로팅 액션 바 */
  .bottom-bar {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    z-index: 15;
    background: rgba(15, 23, 42, 0.94);
    padding: 6px 8px;
    border-radius: 99px;
    border: 1px solid var(--border);
    backdrop-filter: blur(8px);
    max-width: 96vw;
  }
  .fab-btn {
    border: none;
    border-radius: 99px;
    padding: 8px 12px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .fab-oneoff { background: var(--accent); color: #111827; }
  .fab-sleep { background: #312e81; color: #e0e7ff; border: 1px solid #4f46e5; }
  .fab-wake { background: #065f46; color: #d1fae5; border: 1px solid #10b981; }
  .fab-diary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }

  /* 모달 공통 */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.72);
    z-index: 50;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal-sheet {
    background: var(--surface);
    width: 100%;
    max-width: 560px;
    max-height: 90dvh;
    border-radius: 18px 18px 0 0;
    padding: 16px 16px 24px;
    overflow-y: auto;
    border-top: 1px solid var(--border);
  }
  /* 포스트잇 모달은 키보드 올라올 때 가려지지 않도록 상단 정렬 및 여유 높이 부여 */
  #postit-modal {
    align-items: flex-start;
    padding: 18px 10px 10px;
  }
  #postit-modal .modal-sheet {
    border-radius: 16px;
    max-height: 92dvh;
    padding: 18px 16px 22px;
    border: 1px solid var(--border);
  }
  @media (min-width: 600px) {
    .modal-backdrop { align-items: center; padding: 16px; }
    .modal-sheet { border-radius: 16px; }
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .modal-title { font-size: 1.04rem; font-weight: 700; }
  .close-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 11px;
    font-size: 0.82rem;
    cursor: pointer;
  }

  /* 30분 단위 드럼 스크롤 피커 */
  .wheel-picker-wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .wheel-col label {
    display: block;
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 4px;
    text-align: center;
  }
  .wheel-box {
    position: relative;
    height: 132px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    -ms-overflow-style: none;
    scrollbar-width: none;
  }
  .wheel-box::-webkit-scrollbar { display: none; }
  .wheel-highlight {
    position: absolute;
    left: 0; right: 0;
    top: 44px; height: 44px;
    background: var(--primary-soft);
    border-top: 1px solid var(--primary);
    border-bottom: 1px solid var(--primary);
    pointer-events: none;
  }
  .wheel-pad { height: 44px; }
  .wheel-item {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: 700;
    scroll-snap-align: center;
    color: var(--text-muted);
    cursor: pointer;
  }
  .wheel-item.active {
    color: #fff;
    font-size: 1.08rem;
  }

  /* 포스트잇 모달 (여러 줄 입력 & 여유로운 카드 & 수정 기능) */
  .postit-compose-box {
    display: flex;
    gap: 8px;
    align-items: stretch;
    margin-bottom: 14px;
  }
  .postit-compose-box textarea {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 0.92rem;
    line-height: 1.45;
    font-family: inherit;
    resize: vertical;
    min-height: 76px; /* 기본 3줄 높이 확보 */
  }
  .postit-compose-box textarea:focus {
    outline: none;
    border-color: #eab308;
  }
  .postit-add-btn {
    background: var(--postit);
    color: var(--postit-text);
    border: none;
    border-radius: 10px;
    padding: 0 16px;
    font-weight: 800;
    font-size: 0.92rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .postit-list-wrap {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .postit-item {
    background: #fef9c3;
    color: #1e293b;
    border-radius: 12px;
    padding: 12px 13px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    font-weight: 600;
    font-size: 0.92rem;
    line-height: 1.48;
    box-shadow: 0 3px 10px rgba(0,0,0,0.22);
    border-left: 5px solid #eab308;
  }
  .postit-item.done {
    background: #334155;
    color: #94a3b8;
    border-left-color: #64748b;
    box-shadow: none;
  }
  .postit-item.done .postit-text-body {
    text-decoration: line-through;
  }
  .postit-left {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    flex: 1;
    min-width: 0;
    cursor: pointer;
  }
  .postit-check {
    width: 21px;
    height: 21px;
    margin-top: 2px;
    accent-color: var(--success);
    cursor: pointer;
    flex-shrink: 0;
  }
  .postit-text-body {
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
    flex: 1;
  }
  .postit-item-actions {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .postit-action-btn {
    background: rgba(15, 23, 42, 0.08);
    border: none;
    border-radius: 6px;
    padding: 5px 7px;
    cursor: pointer;
    font-size: 0.85rem;
    color: #1e293b;
    font-weight: 700;
  }
  .postit-item.done .postit-action-btn {
    background: rgba(255, 255, 255, 0.08);
    color: #cbd5e1;
  }
  .postit-edit-area {
    width: 100%;
    background: #ffffff;
    color: #0f172a;
    border: 2px solid #ca8a04;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.92rem;
    line-height: 1.45;
    font-family: inherit;
    resize: vertical;
    min-height: 76px;
  }
  .postit-edit-footer {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 7px;
  }
  .postit-save-btn {
    background: #1e293b;
    color: #fef08a;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
  }
  .postit-cancel-btn {
    background: rgba(15, 23, 42, 0.12);
    color: #1e293b;
    border: none;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 0.82rem;
    font-weight: 600;
    cursor: pointer;
  }

  /* 달력 스타일 */
  .cal-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    text-align: center;
  }
  .cal-dow { font-size: 0.74rem; color: var(--text-muted); padding: 4px 0; }
  .cal-day {
    background: var(--bg);
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 5px 2px;
    min-height: 52px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }
  .cal-day.selected { border-color: var(--primary); background: var(--primary-soft); }
  .cal-day.today { font-weight: 800; color: var(--accent); }
  .cal-num { font-size: 0.84rem; }
  .cal-dots { display: flex; gap: 3px; align-items: center; font-size: 0.65rem; }
  .dot-rate { width: 7px; height: 7px; border-radius: 50%; }

  /* 폼 요소 */
  .form-group { margin-bottom: 12px; }
  .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
  .form-control {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    color: var(--text);
    font-size: 0.9rem;
  }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-full {
    width: 100%;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    margin-top: 6px;

function buildInitialTrackedMap(tpl) {
  const map = {};
  Object.keys(tpl).forEach(day => {
    tpl[day].forEach(item => {
      const id = `${day}_${item.start}_${item.title}`;
      if (/서브맥시멀|학교 수업|인강|밸리AI|딥워크|말씀정리|성구복습|3줄일기|주일 예배|삼일예배/.test(item.title)) {
        map[id] = true;
      }
    });
  });
  return map;
}

  template: JSON.parse(localStorage.getItem('rt_template_v2')) || DEFAULT_TEMPLATE,
  trackedIds: JSON.parse(localStorage.getItem('rt_trackedIds_v2')) || null,
  dailyLogs: JSON.parse(localStorage.getItem('rt_dailyLogs_v2')) || {},
  oneOffs: JSON.parse(localStorage.getItem('rt_oneOffs_v2')) || [],
  postits: JSON.parse(localStorage.getItem('rt_postits_v2')) || [],
  cutoffHour: parseInt(localStorage.getItem('rt_cutoff_v2') || '5', 10),
  vision: JSON.parse(localStorage.getItem('rt_vision_v2')) || { sec: 3, text: "오늘의 작은 실행이 쌓여\n원하는 미래를 만든다.", img: "" }
};

if (!state.trackedIds) {
  state.trackedIds = buildInitialTrackedMap(state.template);
}

function saveState() {
  localStorage.setItem('rt_template_v2', JSON.stringify(state.template));
  localStorage.setItem('rt_trackedIds_v2', JSON.stringify(state.trackedIds));
  localStorage.setItem('rt_dailyLogs_v2', JSON.stringify(state.dailyLogs));
  localStorage.setItem('rt_oneOffs_v2', JSON.stringify(state.oneOffs));
  localStorage.setItem('rt_postits_v2', JSON.stringify(state.postits));
  localStorage.setItem('rt_cutoff_v2', String(state.cutoffHour));
  localStorage.setItem('rt_vision_v2', JSON.stringify(state.vision));
}

function getLogicalTodayStr() {
  const now = new Date();
  if (now.getHours() < state.cutoffHour) now.setDate(now.getDate() - 1);
  return formatDateStr(now);
}
function formatDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function parseDateStr(str) {
  const [y, m, d] = str.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function getPrevDateStr(dateStr) {
  const d = parseDateStr(dateStr);
  d.setDate(d.getDate() - 1);
  return formatDateStr(d);
}
function getNowHHMM() {
  const now = new Date();
  return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
}

let selectedDate = getLogicalTodayStr();
let calViewDate = parseDateStr(selectedDate);
let isEditMode = false;
let openMemoId = null;
let editingPostitId = null;

function toLogicalMinutes(timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  let mins = h * 60 + m;
  if (h < state.cutoffHour) mins += 1440;
  return mins;
}
function getCurrentLogicalMinutes() {
  const now = new Date();
  let mins = now.getHours() * 60 + now.getMinutes();
  if (now.getHours() < state.cutoffHour) mins += 1440;
  return mins;
}

let visionTimer = null;
function initVisionSplash() {
  const sec = Number(state.vision.sec);
  if (!sec || (!state.vision.text && !state.vision.img)) return;
  showVisionSplash(sec);
}
function showVisionSplash(sec) {
  const splash = document.getElementById('vision-splash');
  const imgEl = document.getElementById('vision-img-el');
  const quoteEl = document.getElementById('vision-quote-el');
  if (state.vision.img) {
    imgEl.src = state.vision.img;
    imgEl.style.display = 'block';
  } else {
    imgEl.style.display = 'none';
  }
  quoteEl.textContent = state.vision.text || '';
  splash.classList.remove('hidden');
  clearTimeout(visionTimer);
  visionTimer = setTimeout(closeVisionSplash, sec * 1000);
}
function closeVisionSplash() {
  clearTimeout(visionTimer);
  document.getElementById('vision-splash').classList.add('hidden');
}

function ensureDayLog(dateStr) {
  if (!state.dailyLogs[dateStr]) {
    state.dailyLogs[dateStr] = { checked: {}, memos: {}, diary: "", sleepAt: "", wakeAt: "" };
  }
  if (!state.dailyLogs[dateStr].memos) state.dailyLogs[dateStr].memos = {};
  return state.dailyLogs[dateStr];
}

function calcSleepDuration(sleepAt, wakeAt) {
  if (!sleepAt || !wakeAt) return '';
  const [sh, sm] = sleepAt.split(':').map(Number);
  const [wh, wm] = wakeAt.split(':').map(Number);
  let sMin = sh * 60 + sm;
  let wMin = wh * 60 + wm;
  if (wMin <= sMin) wMin += 1440;
  const diff = wMin - sMin;
  return `${Math.floor(diff / 60)}시간 ${diff % 60}분`;
}

function recordSleepNow() {
  const log = ensureDayLog(selectedDate);
  log.sleepAt = getNowHHMM();
  saveState();
  render();
}
function recordWakeNow() {
  const nowStr = getNowHHMM();
  const prevStr = getPrevDateStr(selectedDate);
  const prevLog = state.dailyLogs[prevStr];
  const curLog = ensureDayLog(selectedDate);

  if (prevLog && prevLog.sleepAt && !prevLog.wakeAt) {
    prevLog.wakeAt = nowStr;
  } else {
    curLog.wakeAt = nowStr;
  }
  saveState();
  render();
}

function toggleEditMode() {
  isEditMode = !isEditMode;
  const btn = document.getElementById('edit-mode-btn');
  btn.classList.toggle('active-mode', isEditMode);
  btn.textContent = isEditMode ? '✓ 선택완료' : '☑️ 체크선택';
  document.getElementById('edit-mode-banner').style.display = isEditMode ? 'flex' : 'none';
  render();
}

function toggleTrackedItem(day, idx, id, title) {
  const nextVal = !state.trackedIds[id];
  if (nextVal) {
    let sameCount = 0;
    Object.keys(state.template).forEach(d => {
      state.template[d].forEach(it => { if (it.title === title) sameCount++; });
    });
    if (sameCount > 1 && confirm(`'${title}' 일정이 다른 요일에도 총 ${sameCount}개 있습니다.\n모든 요일에 한꺼번에 체크박스를 켤까요?\n(취소를 누르면 오늘 요일만 켜집니다)`)) {
      Object.keys(state.template).forEach(d => {
        state.template[d].forEach(it => {
          if (it.title === title) state.trackedIds[`${d}_${it.start}_${it.title}`] = true;
        });
      });
    } else {
      state.trackedIds[id] = true;
    }
  } else {
    delete state.trackedIds[id];
  }
  saveState();
  render();
}

function render() {
  const todayStr = getLogicalTodayStr();
  const isToday = (selectedDate === todayStr);
  const dObj = parseDateStr(selectedDate);
  const dowKr = DAYS_KR[dObj.getDay()];
  const dowShort = DAYS_SHORT[dObj.getDay()];

  // 26.11.25(수) 압축 포맷 + 오늘 날짜 하이라이트 블록 적용
  const shortDateText = `${selectedDate.slice(2).replace(/-/g, '.')}(${dowShort})`;
  const headerDateEl = document.getElementById('header-date-text');
  headerDateEl.textContent = shortDateText;
  headerDateEl.classList.toggle('is-today', isToday);

  const dayLog = ensureDayLog(selectedDate);
  const prevStr = getPrevDateStr(selectedDate);
  const prevLog = state.dailyLogs[prevStr];

  const sleepBannerEl = document.getElementById('sleep-banner');
  let lastNightHtml = '어젯밤 수면: 미기록';
  if (prevLog && (prevLog.sleepAt || prevLog.wakeAt)) {
    const dur = calcSleepDuration(prevLog.sleepAt, prevLog.wakeAt);
    lastNightHtml = `어젯밤: <span class="sleep-time-link" onclick="openSleepEditModal('${prevStr}')">${prevLog.sleepAt || '??:??'}~${prevLog.wakeAt || '??:??'}${dur ? ` (${dur})` : ''}</span>`;
  }
  let tonightHtml = `오늘 취침: <span class="sleep-time-link" onclick="openSleepEditModal('${selectedDate}')">${dayLog.sleepAt || '미기록'}</span>`;
  sleepBannerEl.innerHTML = `<span>${lastNightHtml}</span><span>${tonightHtml}</span>`;

  const baseChunks = (state.template[dowKr] || []).map((item, idx) => ({
    ...item,
    isOneOff: false,
    tplIdx: idx,
    id: `${dowKr}_${item.start}_${item.title}`
  }));

  const dayOneOffs = state.oneOffs
    .filter(o => o.date === selectedDate)
    .map(o => ({ ...o, isOneOff: true }));

  const allItems = [...baseChunks, ...dayOneOffs].sort((a, b) => {
    const diff = toLogicalMinutes(a.start) - toLogicalMinutes(b.start);
    if (diff !== 0) return diff;
    return a.isOneOff ? -1 : 1;
  });

  const nowMins = getCurrentLogicalMinutes();
  const listEl = document.getElementById('timeline-list');
  listEl.innerHTML = '';

  let totalTrackable = 0;
  let totalDone = 0;
  let currentCardEl = null;
  let prevEndM = null;

  allItems.forEach(item => {
    const startM = toLogicalMinutes(item.start);
    let endM = toLogicalMinutes(item.end);
    if (endM <= startM) endM += 1440;

    if (!item.isOneOff && prevEndM !== null && startM > prevEndM) {
      const gapSlots = (startM - prevEndM) / 30;
      const gapH = Math.max(28, Math.round(gapSlots * SLOT_HEIGHT));
      const gapDiv = document.createElement('div');
      gapDiv.className = 'gap-card';
      gapDiv.style.height = `${gapH}px`;
      gapDiv.textContent = `빈 시간 (${(startM - prevEndM)}분)`;
      listEl.appendChild(gapDiv);
    }
    if (!item.isOneOff) prevEndM = endM;

    const durationM = endM - startM;
    const slotCount = Math.max(1, Math.round(durationM / 30));
    const cardHeight = slotCount * SLOT_HEIGHT;

    const durText = durationM >= 60
      ? (durationM % 60 === 0 ? `${durationM / 60}시간` : `${Math.floor(durationM / 60)}시간 ${durationM % 60}분`)
      : `${durationM}분`;

    const isTracked = item.isOneOff ? true : !!state.trackedIds[item.id];
    const isPast = isToday && (nowMins >= endM);
    const isCurrent = isToday && (nowMins >= startM && nowMins < endM);
    const isChecked = item.isOneOff ? item.done : !!dayLog.checked[item.id];
    const memoText = dayLog.memos[item.id] || '';

    if (isTracked) {
      totalTrackable++;
      if (isChecked) totalDone++;
    }

    let ticksHtml = '<div class="slot-ticks">';
    for (let s = 0; s < slotCount; s++) ticksHtml += '<div class="slot-tick-seg"></div>';
    ticksHtml += '</div>';

    const wrap = document.createElement('div');
    wrap.className = 'chunk-wrapper';

    const card = document.createElement('div');
    card.style.minHeight = `${cardHeight}px`;
    card.className = 'chunk-card' +
      (slotCount >= 2 ? ' tall' : '') +
      (isPast ? ' past' : '') +
      (isCurrent ? ' current' : '') +
      (item.isOneOff ? ' one-off' : '') +
      (isTracked ? ' is-tracked' : ' untracked') +
      (isChecked && isTracked ? ' completed' : '');

    if (isCurrent) currentCardEl = card;

    let actionHtml = '';
    if (isEditMode && !item.isOneOff) {
      actionHtml = `
        <button class="track-toggle-btn ${isTracked ? 'on' : ''}" onclick="toggleTrackedItem('${dowKr}', ${item.tplIdx}, '${item.id}', '${escapeJs(item.title)}')">
          ${isTracked ? '체크 ON' : '체크 OFF'}
        </button>
        <button class="mini-edit-btn" onclick="openFixedEditModal(${item.tplIdx})">수정</button>
      `;
    } else {
      actionHtml = `
        ${item.isOneOff ? `<button class="mini-edit-btn" onclick="deleteOneOff('${item.id}')">🗑️</button>` : ''}
        ${isTracked ? `<button class="check-circle ${isChecked ? 'checked' : ''}" onclick="toggleItemCheck('${item.id}', ${item.isOneOff})">${isChecked ? '✓' : ''}</button>` : ''}
      `;
    }

    card.innerHTML = `
      ${ticksHtml}
      <div class="chunk-info" onclick="toggleMemoBox('${item.id}')">
        <div class="chunk-time">
          <span>${item.start}~${item.end}</span>
          <span class="tag-pill tag-duration">${durText}</span>
          ${item.isOneOff ? `<span class="tag-pill tag-oneoff">일회성</span>` : ''}
          ${isCurrent ? `<span class="tag-pill tag-now">진행 중</span>` : ''}
          ${memoText ? `<span class="tag-pill tag-memo-dot">메모 있음</span>` : ''}
        </div>
        <div class="chunk-title">${escapeHtml(item.title)}</div>
      </div>
      <div class="chunk-actions">${actionHtml}</div>
    `;

    const memoBox = document.createElement('div');
    memoBox.className = 'inline-memo-box' + (openMemoId === item.id ? ' open' : '');
    memoBox.innerHTML = `
      <input type="text" value="${escapeHtml(memoText)}" placeholder="이 시간대 세부 작업 메모..."
        oninput="saveItemMemo('${item.id}', this.value)"
        onkeydown="if(event.key==='Enter') toggleMemoBox('${item.id}')">
      <button class="close-btn" style="padding:4px 8px;" onclick="toggleMemoBox('${item.id}')">확인</button>
    `;

    wrap.appendChild(card);
    wrap.appendChild(memoBox);
    listEl.appendChild(wrap);
  });

  const pct = totalTrackable > 0 ? Math.round((totalDone / totalTrackable) * 100) : 0;
  document.getElementById('rate-text').textContent = `루틴 ${pct}% (${totalDone}/${totalTrackable})`;
  document.getElementById('rate-bar').style.width = `${pct}%`;

  const uncompletedPostits = state.postits.filter(p => !p.completedDate).length;
  const completedTodayPostits = state.postits.filter(p => p.completedDate === selectedDate).length;
  document.getElementById('postit-badge').textContent = uncompletedPostits;
  document.getElementById('done-postit-summary').textContent = `해치운 일 ${completedTodayPostits}건`;

  const diaryEl = document.getElementById('diary-textarea');
  diaryEl.value = dayLog.diary || '';
  document.getElementById('diary-save-msg').textContent = dayLog.diary ? '저장됨' : '';

  if (isToday && currentCardEl && !window._hasScrolledInitial) {
    window._hasScrolledInitial = true;
    setTimeout(() => currentCardEl.scrollIntoView({ behavior: 'smooth', block: 'center' }), 150);
  }
}

// 30분 단위 드럼 스크롤 휠
function buildWheelPicker(boxId, defaultVal, onSelectCallback) {
  const box = document.getElementById(boxId);
  box.innerHTML = `<div class="wheel-pad"></div>` +
    TIME_OPTIONS_30M.map((t, idx) => `<div class="wheel-item" data-idx="${idx}" data-val="${t}">${t}</div>`).join('') +
    `<div class="wheel-pad"></div>`;

  const items = box.querySelectorAll('.wheel-item');
  items.forEach((el, idx) => {
    el.onclick = () => {
      box.scrollTo({ top: idx * 44, behavior: 'smooth' });
    };
  });

  let scrollTimeout = null;
  box.onscroll = () => {
    clearTimeout(scrollTimeout);
    const activeIdx = Math.min(TIME_OPTIONS_30M.length - 1, Math.max(0, Math.round(box.scrollTop / 44)));
    items.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
    scrollTimeout = setTimeout(() => {
      if (onSelectCallback) onSelectCallback(TIME_OPTIONS_30M[activeIdx], activeIdx);
    }, 80);
  };

  const initIdx = Math.max(0, TIME_OPTIONS_30M.indexOf(defaultVal));
  setTimeout(() => {
    box.scrollTop = initIdx * 44;
    items.forEach((el, i) => el.classList.toggle('active', i === initIdx));
  }, 20);
}

function getWheelValue(boxId) {
  const box = document.getElementById(boxId);
  const activeIdx = Math.min(TIME_OPTIONS_30M.length - 1, Math.max(0, Math.round(box.scrollTop / 44)));
  return TIME_OPTIONS_30M[activeIdx];
}

// 일회성 시간 일정 모달

  });
  buildWheelPicker('oneoff-end-wheel', '15:00', null);

function saveOneOff() {

function deleteOneOff(id) {

// 고정 일정 수정/추가 모달
let editingFixedIdx = -1;
function openFixedEditModal(idx) {
  editingFixedIdx = idx;
  const dowKr = DAYS_KR[parseDateStr(selectedDate).getDay()];
  const list = state.template[dowKr] || [];
  const delBtn = document.getElementById('fixed-delete-btn');

  let initStart = '12:00', initEnd = '13:00', initTitle = '';
  if (idx >= 0 && list[idx]) {
    document.getElementById('fixed-edit-modal-title').textContent = `${dowKr} 고정 일정 수정`;
    initStart = list[idx].start;
    initEnd = list[idx].end;
    initTitle = list[idx].title;
    delBtn.style.display = 'block';
  } else {
    document.getElementById('fixed-edit-modal-title').textContent = `${dowKr} 새 고정 일정 추가`;
    delBtn.style.display = 'none';
  }

  document.getElementById('fixed-edit-title').value = initTitle;
  openModal('fixed-edit-modal');
  buildWheelPicker('fixed-start-wheel', initStart, (val, sIdx) => {
    const nextIdx = Math.min(TIME_OPTIONS_30M.length - 1, sIdx + 1);
    document.getElementById('fixed-end-wheel').scrollTo({ top: nextIdx * 44, behavior: 'smooth' });
  });
  buildWheelPicker('fixed-end-wheel', initEnd, null);
}

function saveFixedEdit() {
  const dowKr = DAYS_KR[parseDateStr(selectedDate).getDay()];
  const start = getWheelValue('fixed-start-wheel');
  const end = getWheelValue('fixed-end-wheel');
  const title = document.getElementById('fixed-edit-title').value.trim();
  if (!title) return alert('일정 제목을 입력해 주세요.');

  if (!state.template[dowKr]) state.template[dowKr] = [];
  if (editingFixedIdx >= 0) {
    const oldItem = state.template[dowKr][editingFixedIdx];
    const oldId = `${dowKr}_${oldItem.start}_${oldItem.title}`;
    const newId = `${dowKr}_${start}_${title}`;
    if (state.trackedIds[oldId]) {
      delete state.trackedIds[oldId];
      state.trackedIds[newId] = true;
    }
    state.template[dowKr][editingFixedIdx] = { start, end, title };
  } else {
    state.template[dowKr].push({ start, end, title });
    state.trackedIds[`${dowKr}_${start}_${title}`] = true;
  }
  state.template[dowKr].sort((a, b) => toLogicalMinutes(a.start) - toLogicalMinutes(b.start));
  saveState();
  closeModal('fixed-edit-modal');
  render();
}

function deleteFixedItem() {
  const dowKr = DAYS_KR[parseDateStr(selectedDate).getDay()];
  if (editingFixedIdx < 0) return;
  if (!confirm('이 고정 일정을 시간표에서 삭제할까요?')) return;
  state.template[dowKr].splice(editingFixedIdx, 1);
  saveState();
  closeModal('fixed-edit-modal');
  render();
}

// 포스트잇 모달 (줄바꿈 유지 + 카드 수정 기능)
function renderPostits() {
  const container = document.getElementById('postit-list');
  container.innerHTML = '';
  const visible = state.postits.filter(p => !p.completedDate || p.completedDate === selectedDate);
  visible.sort((a, b) => (a.completedDate ? 1 : 0) - (b.completedDate ? 1 : 0));

  if (visible.length === 0) {
    container.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:0.86rem; padding:26px 0;">남아있는 포스트잇 메모가 없습니다.</p>`;
    return;
  }
  visible.forEach(p => {
    const isDone = !!p.completedDate;
    const isEditing = (editingPostitId === p.id);
    const div = document.createElement('div');
    div.className = 'postit-item' + (isDone ? ' done' : '');

    if (isEditing) {
      div.innerHTML = `
        <div style="flex:1; min-width:0;">
          <textarea id="postit-edit-ta-${p.id}" class="postit-edit-area" rows="3">${escapeHtml(p.text)}</textarea>
          <div class="postit-edit-footer">
            <button class="postit-cancel-btn" onclick="cancelEditPostit()">취소</button>
            <button class="postit-save-btn" onclick="saveEditPostit('${p.id}')">저장</button>
          </div>
        </div>
      `;
    } else {
      div.innerHTML = `
        <label class="postit-left">
          <input type="checkbox" class="postit-check" ${isDone ? 'checked' : ''} onchange="togglePostit('${p.id}')">
          <div class="postit-text-body">${escapeHtml(p.text)}</div>
        </label>
        <div class="postit-item-actions">
          <button class="postit-action-btn" title="수정" onclick="startEditPostit('${p.id}')">✏️</button>
          <button class="postit-action-btn" title="삭제" onclick="deletePostit('${p.id}')">✕</button>
        </div>
      `;
    }
    container.appendChild(div);
  });
}

function addPostit() {
  const input = document.getElementById('postit-input');
  const text = input.value.trim();
  if (!text) return;
  editingPostitId = null;
  state.postits.unshift({ id: 'p_' + Date.now(), text, completedDate: null });
  input.value = '';
  saveState();
  renderPostits();
  render();
}
function startEditPostit(id) {
  editingPostitId = id;
  renderPostits();
  setTimeout(() => {
    const ta = document.getElementById(`postit-edit-ta-${id}`);
    if (ta) {
      ta.focus();
      ta.setSelectionRange(ta.value.length, ta.value.length);
    }
  }, 20);
}
function cancelEditPostit() {
  editingPostitId = null;
  renderPostits();
}
function saveEditPostit(id) {
  const ta = document.getElementById(`postit-edit-ta-${id}`);
  if (!ta) return;
  const newText = ta.value.trim();
  if (!newText) return alert('내용을 비워둘 수 없습니다.');
  const item = state.postits.find(p => p.id === id);
  if (item) item.text = newText;
  editingPostitId = null;
  saveState();
  renderPostits();
  render();
}
function togglePostit(id) {
  editingPostitId = null;
  const item = state.postits.find(p => p.id === id);
  if (!item) return;
  item.completedDate = item.completedDate ? null : selectedDate;
  saveState();
  renderPostits();
  render();
}
function deletePostit(id) {
  if (editingPostitId === id) editingPostitId = null;
  state.postits = state.postits.filter(p => p.id !== id);
  saveState();
  renderPostits();
  render();
}

// 달력 모달
function renderCalendar() {
  const y = calViewDate.getFullYear();
  const m = calViewDate.getMonth();
  document.getElementById('cal-month-label').textContent = `${y}년 ${m + 1}월`;

  const grid = document.getElementById('cal-grid');
  grid.innerHTML = DAYS_SHORT.map(d => `<div class="cal-dow">${d}</div>`).join('');

  const firstDay = new Date(y, m, 1).getDay();
  const lastDate = new Date(y, m + 1, 0).getDate();
  const todayStr = getLogicalTodayStr();

  for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div></div>`;

  for (let d = 1; d <= lastDate; d++) {
    const dStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const dowKr = DAYS_KR[new Date(y, m, d).getDay()];
    const log = state.dailyLogs[dStr];
    const hasDiary = log && log.diary && log.diary.trim().length > 0;

    const trackedChunks = (state.template[dowKr] || []).filter(c => !!state.trackedIds[`${dowKr}_${c.start}_${c.title}`]);
    let doneCount = 0;
    if (log && log.checked) {
      trackedChunks.forEach(c => {
        if (log.checked[`${dowKr}_${c.start}_${c.title}`]) doneCount++;
      });
    }
    const rate = trackedChunks.length > 0 ? Math.round((doneCount / trackedChunks.length) * 100) : 0;
    const dotColor = doneCount === 0 ? 'transparent' : (rate >= 80 ? '#10b981' : (rate >= 50 ? '#f59e0b' : '#ef4444'));

    const cell = document.createElement('div');
    cell.className = 'cal-day' + (dStr === selectedDate ? ' selected' : '') + (dStr === todayStr ? ' today' : '');
    cell.onclick = () => {
      selectedDate = dStr;
      closeModal('calendar-modal');
      render();
    };
    cell.innerHTML = `
      <span class="cal-num">${d}</span>
      <div class="cal-dots">
        <span class="dot-rate" style="background:${dotColor};"></span>
        ${hasDiary ? '<span>✍️</span>' : ''}
      </div>
    `;
    grid.appendChild(cell);
  }
}
function shiftCalMonth(delta) {
  calViewDate.setMonth(calViewDate.getMonth() + delta);
  renderCalendar();
}

// 엑셀 TSV 파싱
function parseTSV(raw) {
  const rows = [];
  let row = [], cell = '', inQuotes = false;
  for (let i = 0; i < raw.length; i++) {
    const ch = raw[i];
    if (ch === '"') {
      if (inQuotes && raw[i + 1] === '"') { cell += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (ch === '\t' && !inQuotes) {
      row.push(cell.replace(/\r?\n/g, ' ').trim());
      cell = '';
    } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
      if (ch === '\r' && raw[i + 1] === '\n') i++;
      row.push(cell.replace(/\r?\n/g, ' ').trim());
      if (row.some(c => c !== '')) rows.push(row);
      row = []; cell = '';
    } else {
      cell += ch;
    }
  }
  if (cell !== '' || row.length > 0) {
    row.push(cell.replace(/\r?\n/g, ' ').trim());
    if (row.some(c => c !== '')) rows.push(row);
  }
  return rows;
}

function importExcelTSV() {
  const raw = document.getElementById('excel-paste-area').value;
  if (!raw.trim()) return alert('붙여넣은 내용이 없습니다.');
  const rows = parseTSV(raw);
  if (rows.length < 2) return alert('올바른 표 형식이 아닙니다.');

  const header = rows[0];
  const dayColMap = {};
  DAYS_KR.forEach(d => {
    const idx = header.findIndex(h => h.includes(d) || h.includes(d[0]));
    if (idx > 0) dayColMap[d] = idx;
  });
  if (Object.keys(dayColMap).length === 0) {
    return alert('첫 줄에서 요일(월요일~일요일) 헤더를 찾지 못했습니다.');
  }

  const newTemplate = {};
  Object.keys(dayColMap).forEach(day => {
    const colIdx = dayColMap[day];
    const chunks = [];
    for (let r = 1; r < rows.length; r++) {
      const timeRange = rows[r][0] || '';
      const match = timeRange.match(/(\d{1,2}:\d{2})\s*[-~]\s*(\d{1,2}:\d{2})/);
      if (!match) continue;
      const start = match[1].padStart(5, '0');
      const end = match[2].padStart(5, '0');
      const cellText = (rows[r][colIdx] || '').trim();

      if (/^수면$|일정 종료 후 수면/.test(cellText)) continue;

      if (chunks.length > 0 && (cellText === '' || cellText === chunks[chunks.length - 1].title)) {
        chunks[chunks.length - 1].end = end;
      } else if (cellText !== '') {
        chunks.push({ start, end, title: cellText });
      }
    }
    newTemplate[day] = chunks;
  });

  state.template = { ...state.template, ...newTemplate };
  saveState();
  document.getElementById('excel-paste-area').value = '';
  alert('시간표가 적용되었습니다! (수면 칸은 자동 제외됨)');
  closeModal('settings-modal');
  render();
}

// 비전보드 설정
function saveVisionSettings() {
  const sec = parseInt(document.getElementById('vision-sec').value, 10);
  const text = document.getElementById('vision-text').value;
  const fileInput = document.getElementById('vision-file');
  state.vision.sec = sec;
  state.vision.text = text;
  if (fileInput.files && fileInput.files[0]) {
    const reader = new FileReader();
    reader.onload = (e) => {
      state.vision.img = e.target.result;
      saveState();
      alert('비전보드가 저장되었습니다.');
    };
    reader.readAsDataURL(fileInput.files[0]);
  } else {
    saveState();
    alert('비전보드가 저장되었습니다.');
  }
}
function previewVision() {
  state.vision.text = document.getElementById('vision-text').value;
  showVisionSplash(3);
}
function saveCutoff() {
  state.cutoffHour = parseInt(document.getElementById('day-cutoff').value, 10);
  saveState();
  selectedDate = getLogicalTodayStr();
  render();
}

// 백업/복원
function exportBackup() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `routine_backup_${getLogicalTodayStr()}.json`;
  a.click();
}
function importBackup(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const parsed = JSON.parse(ev.target.result);
      state = { ...state, ...parsed };
      saveState();
      alert('백업이 복원되었습니다.');
      render();
    } catch {
      alert('올바른 백업 파일이 아닙니다.');
    }
  };
  reader.readAsText(file);
}

// 모달 제어
function openModal(id) {
  if (id === 'postit-modal') {
    editingPostitId = null;
    renderPostits();
  }
  if (id === 'calendar-modal') {
    calViewDate = parseDateStr(selectedDate);
    renderCalendar();
  }
  if (id === 'settings-modal') {
    document.getElementById('vision-sec').value = String(state.vision.sec ?? 3);
    document.getElementById('vision-text').value = state.vision.text || '';
    document.getElementById('day-cutoff').value = String(state.cutoffHour);
  }
  document.getElementById(id).classList.add('open');
}
function closeModal(id) {
  if (id === 'postit-modal') editingPostitId = null;
  document.getElementById(id).classList.remove('open');
}
function closeModalOnBg(e, id) {
  if (e.target.id === id) closeModal(id);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}
function escapeJs(str) {
  return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}

render();
setInterval(render, 60000);
